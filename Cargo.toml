[package]
name = "airroute-rules"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Domain-first routing rules controller and distributed measurement agent"
license = "GPL-2.0-or-later"
default-run = "rules-control"

[lib]
name = "airroute_rules"

[[bin]]
name = "rules-control"
path = "src/bin/control.rs"

[[bin]]
name = "rules-probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "1"
axum = "=0.8.9"
base64 = "=0.23.1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "=0.2.2"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
flate2 = "1"
hex = "0.4"
hickory-proto = "=0.26.3"
ipnet = { version = "2.12", features = ["serde"] }
mime_guess = "2"
regex = "1.13"
regex-syntax = "=0.8.11"
ring = "=0.17.14"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "stream", "blocking"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust-embed = { version = "=8.13.0", features = ["debug-embed", "deterministic-timestamps", "include-exclude"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"

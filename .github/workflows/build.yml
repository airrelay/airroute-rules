name: Produce AirRoute data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a validated candidate to airrelay/rules main
        type: boolean
        default: true

# A newer queued workflow never runs alongside an older publisher. A source
# commit fence and a normal Git fast-forward check independently reject staleness.
concurrency:
  group: airroute-data-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Correctness and isolated publication tests
        id: correctness
        run: python -m unittest discover -s tests -v
      - name: Read the previous successful coverage manifest
        id: baseline
        run: |
          git remote add products https://github.com/airrelay/rules.git
          git fetch --no-tags products main
          if git cat-file -e FETCH_HEAD:manifest.json 2>/dev/null; then
            python -c "from pathlib import Path; from airroute_data.publish import prepare_baseline; prepare_baseline(Path('.'), Path('.build/previous'), remote='products', branch='main')"
          else
            test "$(git rev-parse FETCH_HEAD)" = 8381d4c0fe473943dbbed52868b88ef87df3d454
            python -c "from pathlib import Path; from airroute_data.publish import prepare_baseline; prepare_baseline(Path('.'), Path('.build/previous'))"
          fi
      - name: Freeze available source inputs
        id: acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
          IPINFO_TOKEN: ${{ secrets.IPINFO_TOKEN }}
          IP2LOCATION_TOKEN: ${{ secrets.IP2LOCATION_TOKEN }}
        run: python -m airroute_data snapshot --output .build/snapshot --record-dir .build/record
      - name: Build and validate the complete candidate
        id: generate
        shell: bash
        run: |
          baseline=()
          if [ -f .build/previous/manifest.json ]; then baseline=(--baseline .build/previous); fi
          python -m airroute_data build --snapshot .build/snapshot/snapshot.json --output .build/candidate --report .build/build-report.json --record-dir .build/record "${baseline[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/candidate/
          if-no-files-found: error
          retention-days: 1
      - name: Record workflow outcome and publication eligibility
        if: always()
        continue-on-error: true
        env:
          BUILD_OUTCOME: ${{ steps.generate.outcome }}
          TEST_OUTCOME: ${{ steps.correctness.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          INPUT_OUTCOME: ${{ steps.acquire.outcome }}
          WORKFLOW_STATE: ${{ job.status }}
          REQUEST_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if [ "$BUILD_OUTCOME" != success ] || [ "$WORKFLOW_STATE" != success ]; then
            python -m airroute_data record-status --record-dir .build/record --workflow-status "$WORKFLOW_STATE" --status skipped --reason "Build job $WORKFLOW_STATE; tests=$TEST_OUTCOME baseline=$BASELINE_OUTCOME inputs=$INPUT_OUTCOME generation=$BUILD_OUTCOME; no validated, uploaded candidate"
          elif [ "$REQUEST_PUBLISH" != true ]; then
            python -m airroute_data record-status --record-dir .build/record --workflow-status "$WORKFLOW_STATE" --status skipped --reason "Publication disabled for this workflow run"
          else
            python -m airroute_data record-status --record-dir .build/record --workflow-status "$WORKFLOW_STATE" --status not-started --reason "Eligible candidate; separate publication job has not started"
          fi
      - name: Package bounded build diagnostics without masking the original failure
        if: always()
        continue-on-error: true
        run: python -m airroute_data record-pack --record-dir .build/record --output .build/diagnostics
      - name: Keep successful or failed build records
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/diagnostics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Raw source archives and account-gated vendor databases are deliberately
      # not uploaded. The candidate contains public derivatives and provenance.

  publish:
    needs: build
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          token: ${{ secrets.RULES_PUBLISH_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/candidate
      - name: Revalidate downloaded data and publish one atomic release commit
        id: publish
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUBLICATION_SEQUENCE: ${{ github.run_number }}
          PUBLICATION_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git remote add products https://github.com/airrelay/rules.git
          python -m airroute_data publish --candidate .build/candidate --repo . --source-sha "$SOURCE_SHA" --sequence "$PUBLICATION_SEQUENCE" --attempt "$PUBLICATION_ATTEMPT" --remote products --branch main --source-remote origin --replace-legacy-head 8381d4c0fe473943dbbed52868b88ef87df3d454 --record-dir .build/publication-record
      - name: Preserve publication identity if transport failed
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: .git/airroute-publish/*/pending.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Record publication job outcome
        if: always()
        continue-on-error: true
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          WORKFLOW_STATE: ${{ job.status }}
        run: |
          fallback=skipped
          if [ "$PUBLISH_OUTCOME" = failure ]; then
            fallback=failed
          elif [ "$PUBLISH_OUTCOME" = success ]; then
            fallback=unconfirmed
          fi
          python -m airroute_data record-status --record-dir .build/publication-record --workflow-status "$WORKFLOW_STATE" --preserve-publication --status "$fallback" --reason "Publication job outcome=$WORKFLOW_STATE command outcome=$PUBLISH_OUTCOME; preserve any existing verified commit or recovery state"
      - name: Package publication diagnostics
        if: always()
        continue-on-error: true
        run: python -m airroute_data record-pack --record-dir .build/publication-record --output .build/publication-diagnostics
      - name: Keep publication outcome separately from candidate data
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/publication-diagnostics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

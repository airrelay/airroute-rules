controller = "quic://rules.example.com:8788"
# Download from the authenticated console, then copy this public certificate to the node.
ca_cert = "controller-cert.der"
server_name = "airroute-rules"
id = "node-REPLACE_WITH_GENERATED_ID"
token_env = "AIRROUTE_NODE_TOKEN"
data_dir = "probe-data"
allow_private_targets = false
tls = true

# Empty resolvers uses /etc/resolv.conf. Explicit resolver comparison is recommended.
[[resolvers]]
name = "cloudflare-udp"
address = "1.1.1.1:53"
transport = "udp"

[[resolvers]]
name = "google-doh"
address = "https://dns.google/dns-query"
transport = "https"

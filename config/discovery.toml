# Read-only public RIPE Atlas results and bounded DNS lookups of accepted names.
# No subnet enumeration, Atlas measurement creation or geographic auto-adjudication.
enabled = true
interval_seconds = 60
dns_per_tick = 16
atlas_page_size = 100
atlas_results_per_tick = 4
atlas_base_url = "https://atlas.ripe.net/api/v2"

[[resolvers]]
name = "cloudflare-doh"
address = "https://cloudflare-dns.com/dns-query"
transport = "https"

[[resolvers]]
name = "google-doh"
address = "https://dns.google/dns-query"
transport = "https"
